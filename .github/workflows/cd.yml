name: cd

on:
  # workflow_run:
  #   workflows: [ci]
  #   branches: [main]
  #   types:
  #     - completed
  push:
    branches: [main]

jobs:
  Deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build app
        run: scripts/buildprod.sh
